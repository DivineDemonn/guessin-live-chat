<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arena Live Duel Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background-color: #0d0f17; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden;
        }
        #chat-header { 
            background: #151824; 
            padding: 14px; 
            text-align: center; 
            border-bottom: 2px solid #ff0055; 
            font-weight: 700; 
            letter-spacing: 1px;
            font-size: 15px;
        }
        #chat-box { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .message { 
            padding: 10px 14px; 
            border-radius: 12px; 
            max-width: 80%; 
            word-wrap: break-word; 
            font-size: 14px;
        }
        .msg-self { 
            background: #ff0055; 
            align-self: flex-end; 
            border-bottom-right-radius: 2px;
        }
        .msg-other { 
            background: #1f2333; 
            align-self: flex-start; 
            border-bottom-left-radius: 2px;
        }
        .username { 
            font-size: 11px; 
            opacity: 0.75; 
            margin-bottom: 4px; 
            display: block; 
            font-weight: 600;
        }
        .chat-img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 4px;
            display: block;
        }
        audio {
            width: 220px;
            height: 36px;
            margin-top: 4px;
        }
        #input-area { 
            display: flex; 
            align-items: center;
            gap: 8px;
            padding: 10px 12px; 
            background: #151824; 
            border-top: 1px solid #232738;
        }
        .action-btn {
            background: #232738;
            color: #fff;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .action-btn.recording {
            background: #ff0055;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.12); }
        }
        #msg-input { 
            flex: 1; 
            padding: 10px 16px; 
            border: 1px solid #2a2e42; 
            border-radius: 20px; 
            background: #1f2333; 
            color: #fff; 
            outline: none; 
            font-size: 14px;
        }
        #send-btn { 
            background: #ff0055; 
            color: white; 
            border: none; 
            padding: 9px 16px; 
            border-radius: 20px; 
            font-weight: bold; 
            cursor: pointer; 
        }
    </style>
</head>
<body>
    <div id="chat-header">⚔️ ARENA DUEL LIVE CHAT</div>
    <div id="chat-box"></div>

    <div id="input-area">
        <input type="file" id="photo-input" accept="image/*" style="display:none;">
        <button class="action-btn" id="photo-btn" title="Send Photo">📷</button>
        <button class="action-btn" id="voice-btn" title="Record Voice">🎤</button>
        <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>

    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const room = urlParams.get('room') || 'global_arena';

        let username = "Challenger";
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.initDataUnsafe?.user?.first_name) {
                username = tg.initDataUnsafe.user.first_name;
            }
        }

        socket.emit('joinRoom', room);

        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const photoBtn = document.getElementById('photo-btn');
        const photoInput = document.getElementById('photo-input');
        const voiceBtn = document.getElementById('voice-btn');

        function appendMessage(data, isSelf) {
            const div = document.createElement('div');
            div.className = 'message ' + (isSelf ? 'msg-self' : 'msg-other');
            
            let contentHtml = `<span class="username">${data.user}</span>`;
            if (data.type === 'image') {
                contentHtml += `<img src="${data.content}" class="chat-img" alt="Photo">`;
            } else if (data.type === 'audio') {
                contentHtml += `<audio controls src="${data.content}"></audio>`;
            } else {
                contentHtml += `<span>${data.content}</span>`;
            }

            div.innerHTML = contentHtml;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendTextMessage() {
            const text = msgInput.value.trim();
            if (text) {
                socket.emit('chatMessage', { room, user: username, type: 'text', content: text });
                msgInput.value = '';
            }
        }
        sendBtn.addEventListener('click', sendTextMessage);
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendTextMessage();
        });

        photoBtn.addEventListener('click', () => photoInput.click());
        photoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) {
                alert("Photo must be smaller than 5MB");
                return;
            }
            const reader = new FileReader();
            reader.onloadend = () => {
                socket.emit('chatMessage', { room, user: username, type: 'image', content: reader.result });
                photoInput.value = '';
            };
            reader.readAsDataURL(file);
        });

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        voiceBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            socket.emit('chatMessage', { room, user: username, type: 'audio', content: reader.result });
                        };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(t => t.stop());
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    voiceBtn.classList.add('recording');
                    voiceBtn.innerText = '⏹️';
                } catch (err) {
                    alert('Microphone access denied. Check Telegram permissions.');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                voiceBtn.classList.remove('recording');
                voiceBtn.innerText = '🎤';
            }
        });

        socket.on('message', (data) => {
            appendMessage(data, data.user === username);
        });
    </script>
</body>
</html>
